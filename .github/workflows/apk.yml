name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Compilar o app
        run: npm run build

      - name: Copiar para o projeto Android
        run: npx cap sync android

      - name: Gerar APK
        working-directory: android
        run: |
          chmod +x gradlew
          # tenta de novo se algum download falhar no meio do caminho
          ./gradlew assembleRelease --no-daemon || (sleep 20 && ./gradlew assembleRelease --no-daemon --refresh-dependencies)
          cp app/build/outputs/apk/release/app-release.apk ../AtelieDeBolso.apk

      - name: Guardar APK (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: AtelieDeBolso-apk
          path: AtelieDeBolso.apk

      - name: Publicar versão para baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ateliê de Bolso 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: AtelieDeBolso.apk
          body: |
            📱 Baixe o arquivo **AtelieDeBolso.apk** abaixo pelo celular Android e abra para instalar.
            (Se o Android pedir, permita instalar apps desta fonte.)
